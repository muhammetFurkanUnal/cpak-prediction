<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cpak — Orthopedic Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">

  <!-- HEADER: logo + load image button (shown after first inference) -->
  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/>
      </svg>
      cpak <span>analysis</span>
    </div>
    <label class="nav-load-btn" id="nav-load-btn" title="Load new image">
      <input type="file" id="fab-input" accept="image/*" style="display:none;" />
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Load Image
    </label>
  </header>

  <main>

    <!-- INPUT PANEL: image upload (left) + model selection & run button (right).
         Hidden after inference runs, restored on Clear. -->
    <div class="top-grid" id="top-grid">

      <!-- Upload zone: click or drag & drop an X-ray image -->
      <div class="card">
        <div class="card-title">X-Ray Image</div>
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="file-input" accept="image/*" />
          <img id="preview-img" alt="preview" />           <!-- thumbnail preview -->
          <div class="preview-overlay">
            <span class="preview-name" id="preview-name"></span> <!-- filename -->
          </div>
          <div id="upload-placeholder">                    <!-- shown before file chosen -->
            <svg class="upload-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <div class="upload-hint"><strong>Click to upload</strong> or drag & drop<br/>JPEG, PNG, BMP supported</div>
          </div>
        </div>
      </div>

      <!-- Settings panel: model dropdown, run/clear buttons, active model display -->
      <div class="card control-panel">
        <div class="card-title">Settings</div>
        <div>
          <label class="field-label" for="model-select">Model</label>
          <select id="model-select"><option value="">Loading models…</option></select>
        </div>
        <div style="flex:1"></div>
        <button class="btn btn-primary" id="run-btn" disabled>
          <div class="spinner" id="btn-spinner"></div>
          <svg id="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span id="btn-label">Run Inference</span>
        </button>
        <button class="btn btn-ghost" id="clear-btn">Clear</button>
        <div id="model-info" style="display:none; padding:10px; background:var(--surface); border-radius:8px; border:1px solid var(--border);">
          <div style="font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;">Active Model</div>
          <div id="model-name-display" style="font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent);"></div>
        </div>
      </div>

    </div><!-- /top-grid -->


    <!-- RESULTS SECTION: shown after inference. Viewer fills viewport, metrics float as overlay panel. -->
    <div id="results-section" style="display:none;">
      <div id="results-grid" class="results-grid">

        <!-- Floating action buttons (top-left overlay) -->
        <div class="map-actions">
          <button class="download-btn" id="dl-vis" style="display:none;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Download
          </button>
          <button class="panel-clear-btn" id="panel-clear-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Clear
          </button>
        </div>

        <!-- Full-screen annotated X-ray viewer -->
        <div class="result-img-card">
          <div class="result-img-header">
            <div class="result-img-title">
              <span>Mechanical Axes</span>
              <span class="result-badge badge-vis">visualize</span>
            </div>
          </div>
          <!-- Interactive image container: zoom, pan, fullscreen -->
          <div class="viewer-container" id="vis-wrap">
            <div class="img-placeholder">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span>Run inference to see results</span>
            </div>
          </div>
        </div><!-- /result-img-card -->

      </div>
    </div><!-- /results-section -->

  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/static/viewer.js"></script>
<script src="/static/canvas.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
